<text x="390" y="878" font-size="12">LLM roles: fresh Mozaik 4.2.0 agents on GPT-6.1 Sol via OpenRouter. Jev (typesafe/jev-1.14) also runs as a Mozaik agent.</text>
<text x="390" y="894" font-size="12">The only loop is Writer ⇄ Critic; a dropped pair hands the challenge to the next screened pair (at most 8); a challenge below 0.5 or out of pairs ends with the furthest stage reached.</text>
